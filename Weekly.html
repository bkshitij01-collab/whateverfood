<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a6b52">
<title>Weekly Summary · Food Tracker</title>
<style>
:root{--bg:#F4F6F7;--card:#FFF;--soft:#F8FAFB;--him:#1a6b52;--him-soft:rgba(26,107,82,.09);--him-light:#e7f4ef;--her:#8B3A6B;--her-soft:rgba(139,58,107,.09);--her-light:#f4eaf1;--green:#27AE60;--yellow:#E67E22;--red:#E74C3C;--text:#2C3E50;--muted:#7F8C8D;--light:#BDC3C7;--border:#ECF0F1;--border2:#DDE2E5;--shadow:0 1px 4px rgba(0,0,0,.05);--shadow2:0 4px 16px rgba(0,0,0,.07);--r:14px}
[data-theme=dark]{--bg:#0d1117;--card:#161b22;--soft:#1c2128;--him:#2ECC71;--him-soft:rgba(46,204,113,.1);--him-light:rgba(46,204,113,.07);--her:#c77daa;--her-soft:rgba(199,125,170,.1);--her-light:rgba(199,125,170,.07);--green:#2ECC71;--yellow:#F39C12;--red:#EC7063;--text:#e6edf3;--muted:#8B949E;--light:#484F58;--border:#21262D;--border2:#30363D;--shadow:0 1px 4px rgba(0,0,0,.3);--shadow2:0 4px 16px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro',Segoe UI,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:40px}
.header{position:sticky;top:0;z-index:90;background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;box-shadow:var(--shadow2);display:flex;align-items:center;gap:10px}
.back-btn{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border2);background:var(--soft);cursor:pointer;font-size:18px;color:var(--text);display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.back-btn:active{transform:scale(.93)}
.header-title{font-size:16px;font-weight:800;flex:1}
.theme-btn{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border2);background:var(--soft);cursor:pointer;font-size:16px;color:var(--text);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--light);display:inline-block;transition:background .3s;margin-left:4px}
.sync-dot.live{background:var(--green);box-shadow:0 0 0 2px rgba(39,174,96,.25)}
.avg-wrap{padding:16px 16px 0;max-width:720px;margin:0 auto}
.avg-card{background:linear-gradient(135deg,var(--him),#0f4a38);border-radius:var(--r);padding:18px;color:#fff;box-shadow:var(--shadow2)}
.avg-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.75;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.avg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.avg-person{background:rgba(255,255,255,.1);border-radius:10px;padding:12px}
.avg-person-label{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.75;margin-bottom:6px}
.avg-score-big{font-size:32px;font-weight:800;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.avg-streak{font-size:11px;opacity:.8;display:flex;align-items:center;gap:4px}
.avg-streak-dots{display:flex;gap:3px;margin-top:6px}
.streak-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.streak-dot.hit{background:rgba(255,255,255,.9)}
.avg-macros{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:10.5px}
.avg-macro-item{text-align:center}
.avg-macro-val{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.avg-macro-lbl{opacity:.65;margin-top:2px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px}
.loading-spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--him);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--muted)}
.days-wrap{padding:12px 16px 0;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.day-card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden}
.day-header{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.day-header:active{background:var(--soft)}
.day-label-col{flex:1;min-width:0}
.day-label{font-size:14px;font-weight:700}
.day-sub{font-size:10.5px;color:var(--muted);margin-top:1px}
.score-chips{display:flex;gap:6px;flex-shrink:0}
.score-chip{padding:5px 9px;border-radius:100px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;border:1px solid}
.sc-green{background:rgba(39,174,96,.1);color:var(--green);border-color:rgba(39,174,96,.4)}
.sc-yellow{background:rgba(230,126,34,.1);color:var(--yellow);border-color:rgba(230,126,34,.4)}
.sc-red{background:rgba(231,76,60,.08);color:var(--red);border-color:rgba(231,76,60,.3)}
.sc-empty{background:var(--soft);color:var(--light);border-color:var(--border)}
.day-chevron{font-size:13px;color:var(--muted);transition:transform .25s;flex-shrink:0}
.day-card.open .day-chevron{transform:rotate(180deg)}
.day-details{max-height:0;overflow:hidden;transition:max-height .3s ease}
.day-card.open .day-details{max-height:640px}
.detail-inner{padding:0 14px 14px;border-top:1px solid var(--border)}
.detail-section{margin-top:12px}
.detail-section-title{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.detail-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-person-card{background:var(--soft);border-radius:10px;padding:10px 12px;border:1.5px solid var(--border)}
.detail-person-card.him{border-color:rgba(26,107,82,.3)}
.detail-person-card.her{border-color:rgba(139,58,107,.3)}
.dp-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.detail-person-card.him .dp-name{color:var(--him)}
.detail-person-card.her .dp-name{color:var(--her)}
.dp-score{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:8px}
.detail-person-card.him .dp-score{color:var(--him)}
.detail-person-card.her .dp-score{color:var(--her)}
.dp-macros{display:flex;flex-direction:column;gap:3px}
.dp-macro{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.dp-macro strong{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.dp-empty{font-size:12px;color:var(--light);font-style:italic;padding:8px 0}
.go-day-btn{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:10px;padding:8px;border-radius:9px;background:var(--soft);border:1.5px solid var(--border2);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.go-day-btn:active{background:var(--him-soft);border-color:var(--him);color:var(--him)}
.empty-state{text-align:center;padding:48px 24px}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:700;margin-bottom:6px}
.empty-msg{font-size:13px;color:var(--muted);line-height:1.6}
.no-firebase{background:rgba(230,126,34,.08);border:1px solid rgba(230,126,34,.2);border-radius:10px;padding:14px;font-size:13px;color:var(--yellow);text-align:center;line-height:1.6;max-width:720px;margin:16px auto}
</style>
</head>

id:'sweet_h',score:-2,m:[150,0,40,0,0]},{id:'refined_h',score:-1,m:[300,8,60,4,2]},{id:'processed_h',score:-1.5,m:[250,4,35,12,1]},{id:'caffeine_h',score:-.75,m:[0,0,0,0,0]}]},extras:[{id:'spearmint_x',score:.5,m:[5,0,1,0,0]},{id:'chaach_hx',score:.25,m:[55,3,5,2,0]},{id:'bubly_hx',score:0,m:[0,0,0,0,0]},{id:'walks_hx',score:.5,m:[0,0,0,0,0]},{id:'water_hx',score:0,m:[0,0,0,0,0]},{id:'flo_hx',score:.25,m:[60,1,14,0,3]},{id:'fmod_hx',score:-.25,m:[65,1,16,0,2]},{id:'fhi_hx',score:-1,m:[70,1,18,0,1]},{id:'dairy_hx',score:-.5,m:[80,5,5,6,0]},{id:'lattes_hx',score:-.5,m:[130,5,18,5,0]},{id:'biscuits_hx',score:-.25,m:[95,2,16,3,1]}],workout:[{id:'badminton_h',burn:200},{id:'muaythai_h',burn:270},{id:'weights_h',burn:40},{id:'walk10_h',burn:35},{id:'walk20_h',burn:65},{id:'walk30_h',burn:95}]};
const CONFIGS={him:HIM,her:HER};

/* ═══ SCORING (pure — takes raw state object from Firebase) ═══ */
function effMacros(sk,o,st){
  if(!o.ingr)return o.m||[0,0,0,0,0];
  const ck=`${sk}__${o.id}`,c=st.customs?.[ck];
  if(!c||Object.keys(c).length===0)return o.m||[0,0,0,0,0];
  const mm=[0,0,0,0,0];
  o.ingr.forEach((ig,i)=>{const mu=c[i]!==undefined?Number(c[i]):1;if(mu<=0)return;for(let j=0;j<5;j++)mm[j]+=(ig.m[j]||0)*mu;});
  return mm;
}
function dayMacros(cfg,st){
  const m={cal:0,protein:0,carbs:0,fat:0,fiber:0};
  for(const sk in cfg.slots)cfg.slots[sk].opts.forEach(o=>{const cnt=Math.max(0,st.counts?.[`${sk}__${o.id}`]||0);if(cnt<=0)return;const ma=effMacros(sk,o,st);m.cal+=ma[0]*cnt;m.protein+=ma[1]*cnt;m.carbs+=ma[2]*cnt;m.fat+=ma[3]*cnt;m.fiber+=(ma[4]||0)*cnt;});
  cfg.indulgences.opts.forEach(o=>{const cnt=Math.max(0,st.inds?.[o.id]||0);if(cnt<=0||!o.m)return;m.cal+=o.m[0]*cnt;m.protein+=o.m[1]*cnt;m.carbs+=o.m[2]*cnt;m.fat+=o.m[3]*cnt;m.fiber+=(o.m[4]||0)*cnt;});
  cfg.extras.forEach(e=>{const cnt=Math.max(0,st.extras?.[e.id]||0);if(cnt<=0||!e.m)return;m.cal+=e.m[0]*cnt;m.protein+=e.m[1]*cnt;m.carbs+=e.m[2]*cnt;m.fat+=e.m[3]*cnt;m.fiber+=(e.m[4]||0)*cnt;});
  return m;
}
function dayBurn(cfg,st){return Math.min(cfg.workout.reduce((t,w)=>t+Math.max(0,st.workout?.[w.id]||0)*w.burn,0),cfg.burnCap);}
function calPen(n,t,g){const x=n-(t+g);return x<=0?0:-Math.min(3,x/200);}
function carbPen(c,t,g){const x=c-(t+g);return x<=0?0:-Math.min(2.5,x/15);}
function dayHasTakeout(cfg,st){for(const sk in cfg.slots)for(const o of cfg.slots[sk].opts)if(o.takeout&&Math.max(0,st.counts?.[`${sk}__${o.id}`]||0)>0)return true;return Object.values(st.inds||{}).some(v=>Number(v)>0);}
function dayMaster(cfg,st){if(cfg.id!=='him')return false;if(!dayHasTakeout(cfg,st))return false;const c=st.counts||{};return(Number(c['coffee1__black1'])||0)>0&&(Number(c['coffee2__black2'])||0)>0;}
function dayScore(cfg,st){
  let s=0;
  for(const sk in cfg.slots)cfg.slots[sk].opts.forEach(o=>{const c=Math.max(0,st.counts?.[`${sk}__${o.id}`]||0);if(c>0)s+=c*o.score;});
  cfg.indulgences.opts.forEach(o=>{const c=Math.max(0,st.inds?.[o.id]||0);if(c>0)s+=c*o.score;});
  cfg.extras.forEach(e=>{const c=Math.max(0,st.extras?.[e.id]||0);if(c>0)s+=c*e.score;});
  const m=dayMacros(cfg,st),b=dayBurn(cfg,st),net=m.cal-b;
  s+=calPen(net,cfg.targets.cal,cfg.grace.cal);
  s+=carbPen(m.carbs,cfg.targets.carbs,cfg.grace.carb);
  if(dayMaster(cfg,st))s+=0.5;
  return Math.round(s*100)/100;
}
function hasLog(st){
  if(!st)return false;
  const anyPos=o=>o&&Object.values(o).some(v=>Number(v)>0);
  const counts=st.counts&&Object.keys(st.counts).length>0;
  return!!(counts||anyPos(st.extras)||anyPos(st.inds)||anyPos(st.workout));
}

/* ═══ DATES + RENDER ═══ */
function last7(){const a=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);a.push(d.toISOString().split('T')[0]);}return a;}
function dayLabel(ds){const d=new Date(ds+'T12:00:00'),today=new Date().toISOString().split('T')[0],y=new Date();y.setDate(y.getDate()-1);const yd=y.toISOString().split('T')[0];if(ds===today)return{main:'Today',sub:d.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'})};if(ds===yd)return{main:'Yesterday',sub:d.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'})};return{main:d.toLocaleDateString('en-CA',{weekday:'long'}),sub:d.toLocaleDateString('en-CA',{month:'long',day:'numeric'})};}
function sStr(s){if(s===null||s===undefined)return'—';return(s>=0?'+':'')+s.toFixed(2);}
function chipCls(s,has){if(!has)return'sc-empty';if(s>=5)return'sc-green';if(s>=3)return'sc-yellow';return'sc-red';}

function compute(dayData){const out={};['him','her'].forEach(p=>{const st=dayData?.[p]||{};const has=hasLog(st);out[p]={has,score:has?dayScore(CONFIGS[p],st):null,macros:has?dayMacros(CONFIGS[p],st):null,burn:has?dayBurn(CONFIGS[p],st):0};});return out;}

function renderAvg(dates,data){
  let himS=[],herS=[],himCal=0,himP=0,herCal=0,herP=0,himStreak=0,herStreak=0;
  const comp=dates.map(d=>compute(data[d]));
  comp.forEach((c,i)=>{
    if(c.him.has){himS.push(c.him.score);himCal+=c.him.macros.cal-c.him.burn;himP+=c.him.macros.protein;if(c.him.score>=5&&i===himStreak)himStreak++;}
    if(c.her.has){herS.push(c.her.score);herCal+=c.her.macros.cal-c.her.burn;herP+=c.her.macros.protein;if(c.her.score>=5&&i===herStreak)herStreak++;}
  });
  const himAvg=himS.length?himS.reduce((a,b)=>a+b,0)/himS.length:null;
  const herAvg=herS.length?herS.reduce((a,b)=>a+b,0)/herS.length:null;
  const dot=h=>`<div class="streak-dot ${h?'hit':''}"></div>`;
  const himDots=comp.slice().reverse().map(c=>dot(c.him.has&&c.him.score>=5)).join('');
  const herDots=comp.slice().reverse().map(c=>dot(c.her.has&&c.her.score>=5)).join('');
  return`<div class="avg-wrap"><div class="avg-card">
    <div class="avg-title">📊 7-Day Average</div>
    <div class="avg-grid">
      <div class="avg-person"><div class="avg-person-label">👨 Him</div><div class="avg-score-big">${sStr(himAvg)}</div><div class="avg-streak">🔥 ${himStreak} day streak</div><div class="avg-streak-dots">${himDots}</div></div>
      <div class="avg-person"><div class="avg-person-label">👩 Her</div><div class="avg-score-big">${sStr(herAvg)}</div><div class="avg-streak">🔥 ${herStreak} day streak</div><div class="avg-streak-dots">${herDots}</div></div>
    </div>
    <div class="avg-macros">
      <div class="avg-macro-item"><div class="avg-macro-val">${himS.length?Math.round(himCal/himS.length):'—'}</div><div class="avg-macro-lbl">his cal/day</div></div>
      <div class="avg-macro-item"><div class="avg-macro-val">${himS.length?Math.round(himP/himS.length)+'g':'—'}</div><div class="avg-macro-lbl">his protein</div></div>
      <div class="avg-macro-item"><div class="avg-macro-val">${herS.length?Math.round(herCal/herS.length):'—'}</div><div class="avg-macro-lbl">her cal/day</div></div>
      <div class="avg-macro-item"><div class="avg-macro-val">${herS.length?Math.round(herP/herS.length)+'g':'—'}</div><div class="avg-macro-lbl">her protein</div></div>
    </div>
  </div></div>`;
}

function dpCard(c,cls,name,T){
  if(!c.has)return`<div class="detail-person-card ${cls}"><div class="dp-name">${name}</div><div class="dp-empty">No data logged</div></div>`;
  const m=c.macros,net=Math.round(m.cal-c.burn);
  return`<div class="detail-person-card ${cls}"><div class="dp-name">${name}</div><div class="dp-score">${sStr(c.score)}</div><div class="dp-macros">
    <div class="dp-macro"><span>Net cal</span><strong>${net} / ${T.cal}</strong></div>
    <div class="dp-macro"><span>Protein</span><strong>${Math.round(m.protein)}g / ${T.protein}g</strong></div>
    <div class="dp-macro"><span>Carbs</span><strong>${Math.round(m.carbs)}g / ${T.carbs}g</strong></div>
    <div class="dp-macro"><span>Fat</span><strong>${Math.round(m.fat)}g / ${T.fat}g</strong></div>
    ${T.fiber?`<div class="dp-macro"><span>Fiber</span><strong>${Math.round(m.fiber)}g / ${T.fiber}g</strong></div>`:''}
  </div></div>`;
}

function renderDay(ds,dayData,i){
  const lbl=dayLabel(ds),c=compute(dayData),id=`day-${i}`;
  const himChip=`<span class="score-chip ${chipCls(c.him.score,c.him.has)}">👨 ${sStr(c.him.score)}</span>`;
  const herChip=`<span class="score-chip ${chipCls(c.her.score,c.her.has)}">👩 ${sStr(c.her.score)}</span>`;
  return`<div class="day-card" id="${id}">
    <div class="day-header" onclick="document.getElementById('${id}').classList.toggle('open')">
      <div class="day-label-col"><div class="day-label">${lbl.main}</div><div class="day-sub">${lbl.sub}</div></div>
      <div class="score-chips">${himChip}${herChip}</div><div class="day-chevron">▾</div>
    </div>
    <div class="day-details"><div class="detail-inner">
      <div class="detail-section"><div class="detail-section-title">Scores & Macros</div>
        <div class="detail-row">${dpCard(c.him,'him','👨 Him',HIM.targets)}${dpCard(c.her,'her','👩 Her',HER.targets)}</div>
      </div>
      <div class="go-day-btn" onclick="goToDay('${ds}')">📝 Open this day in tracker →</div>
    </div></div>
  </div>`;
}

function goToDay(ds){try{sessionStorage.setItem('gotoDate',ds);}catch(e){}window.location.href='index.html';}

function renderAll(dates,data){
  const has=dates.some(d=>{const c=compute(data[d]);return c.him.has||c.her.has;});
  let html=renderAvg(dates,data)+`<div class="days-wrap">`;
  if(!has)html+=`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No data in the last 7 days</div><div class="empty-msg">Log food in the tracker — scores appear here automatically.</div></div>`;
  else dates.forEach((d,i)=>html+=renderDay(d,data[d]||{},i));
  html+=`</div>`;
  document.getElementById('appContent').innerHTML=html;
}

/* ═══ FIREBASE ═══ */
function loadData(){
  const dates=last7();
  if(!FIREBASE_CONFIG.apiKey){document.getElementById('appContent').innerHTML=`<div class="no-firebase">🔥 Firebase not configured.</div>`;return;}
  const load=(src,cb)=>{const s=document.createElement('script');s.src=src;s.onload=cb;s.onerror=()=>{document.getElementById('appContent').innerHTML=`<div class="no-firebase">⚠️ Couldn't load Firebase. Check your connection.</div>`;};document.head.appendChild(s);};
  load('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',()=>{
    load('https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js',()=>{
      try{
        if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
        const db=firebase.database();
        document.getElementById('syncDot').classList.add('live');
        const data={};
        Promise.all(dates.map(d=>db.ref(`trackers/${SYNC_KEY}/dt/${d}`).once('value').then(s=>{data[d]=s.val()||{};}))).then(()=>{
          renderAll(dates,data);
          db.ref(`trackers/${SYNC_KEY}/dt/${dates[0]}`).on('value',s=>{data[dates[0]]=s.val()||{};renderAll(dates,data);});
        }).catch(e=>{document.getElementById('appContent').innerHTML=`<div class="no-firebase">⚠️ ${e.message}</div>`;});
      }catch(e){document.getElementById('appContent').innerHTML=`<div class="no-firebase">⚠️ ${e.message}</div>`;}
    });
  });
}
loadData();
