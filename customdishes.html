<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dish Library</title>
<style>
:root{
  --bg:#F4F6F7;--card:#FFF;--soft:#F8FAFB;
  --him:#1a6b52;--him-soft:rgba(26,107,82,.09);--him-light:#e7f4ef;
  --her:#8B3A6B;--her-soft:rgba(139,58,107,.09);--her-light:#f4eaf1;
  --green:#27AE60;--yellow:#E67E22;--red:#E74C3C;
  --text:#2C3E50;--muted:#7F8C8D;--light:#BDC3C7;
  --border:#ECF0F1;--border2:#DDE2E5;
  --shadow:0 1px 4px rgba(0,0,0,.05);--shadow2:0 4px 16px rgba(0,0,0,.07);
  --r:14px;
}
[data-theme=dark]{
  --bg:#0d1117;--card:#161b22;--soft:#1c2128;
  --him:#2ECC71;--him-soft:rgba(46,204,113,.1);--him-light:rgba(46,204,113,.07);
  --her:#c77daa;--her-soft:rgba(199,125,170,.1);--her-light:rgba(199,125,170,.07);
  --green:#2ECC71;--yellow:#F39C12;--red:#EC7063;
  --text:#e6edf3;--muted:#8B949E;--light:#484F58;
  --border:#21262D;--border2:#30363D;
  --shadow:0 1px 4px rgba(0,0,0,.3);--shadow2:0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh;padding-bottom:30px}
/* ── HEADER ── */
.cd-header{position:sticky;top:0;z-index:90;background:var(--bg);padding:10px 14px 8px;border-bottom:1.5px solid var(--border)}
.cd-header-row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cd-title{font-size:16px;font-weight:800;flex:1}
.icon-btn{background:none;border:1px solid var(--border2);border-radius:8px;padding:6px 9px;font-size:15px;cursor:pointer;color:var(--text)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--light);display:inline-block;flex-shrink:0}
.sync-dot.live{background:var(--green)}
/* ── SEARCH ── */
.search-wrap{position:relative}
.search-input{width:100%;padding:8px 32px 8px 12px;border:1.5px solid var(--border2);border-radius:10px;background:var(--card);color:var(--text);font-size:13px;outline:none}
.search-input:focus{border-color:var(--him)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--light);font-size:16px;cursor:pointer;padding:2px 4px;display:none}
/* ── TABS ── */
.person-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin:0 14px}
.tab-btn{flex:1;padding:10px 0;font-size:13px;font-weight:700;background:none;border:none;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-2px}
.tab-btn.him.active{color:var(--him);border-bottom-color:var(--him)}
.tab-btn.her.active{color:var(--her);border-bottom-color:var(--her)}
/* ── SLOT SECTION ── */
.cd-section{margin:10px 14px 0}
.cd-slot{background:var(--card);border-radius:var(--r);border:1.5px solid var(--border);margin-bottom:10px;overflow:hidden}
.cd-slot-hdr{display:flex;align-items:center;padding:10px 13px;cursor:pointer;user-select:none;gap:8px}
.cd-slot-hdr-info{flex:1}
.cd-slot-title{font-size:13.5px;font-weight:800}
.cd-slot-time{font-size:10.5px;color:var(--muted);margin-top:1px}
.cd-slot-arrow{font-size:11px;color:var(--light);transition:transform .2s}
.cd-slot-arrow.open{transform:rotate(90deg)}
.cd-slot-add{font-size:11px;font-weight:700;padding:5px 10px;border:1.5px solid var(--border2);border-radius:8px;background:none;cursor:pointer;color:var(--muted);white-space:nowrap}
.cd-slot-add:active{background:var(--soft)}
/* ── DISH ROW ── */
.cd-dish{display:flex;align-items:center;gap:9px;padding:9px 13px;border-top:1px solid var(--border);position:relative}
.cd-dish:first-child{border-top:none}
.cd-dish.hidden{display:none}
.score-badge{min-width:34px;text-align:center;font-size:11px;font-weight:800;padding:2px 5px;border-radius:6px;flex-shrink:0}
.score-badge.pos2{background:rgba(26,107,82,.13);color:var(--him)}
.score-badge.pos1{background:rgba(39,174,96,.13);color:var(--green)}
.score-badge.zero{background:var(--soft);color:var(--light)}
.score-badge.neg1{background:rgba(230,126,34,.13);color:var(--yellow)}
.score-badge.neg2{background:rgba(231,76,60,.13);color:var(--red)}
.cd-dish-info{flex:1;min-width:0}
.cd-dish-name{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-dish-sub{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-macros{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.cd-m{font-size:9.5px;font-weight:600;padding:1px 5px;border-radius:4px;background:var(--soft);color:var(--muted)}
.cd-m.protein{background:var(--him-soft);color:var(--him)}
.cd-m.carbs{background:rgba(230,126,34,.1);color:var(--yellow)}
/* ── DISH ACTIONS ── */
.cd-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.cd-star{background:none;border:none;font-size:16px;cursor:pointer;padding:3px;opacity:.35;transition:opacity .15s,transform .15s}
.cd-star.on{opacity:1}
.cd-star:active{transform:scale(1.3)}
.cd-crown{background:none;border:none;font-size:14px;cursor:pointer;padding:3px;opacity:.25;transition:opacity .15s}
.cd-crown.on{opacity:1}
.cd-add-today{background:var(--him);color:#fff;border:none;border-radius:8px;font-size:11px;font-weight:700;padding:5px 8px;cursor:pointer;white-space:nowrap;transition:background .15s}
.cd-add-today.her{background:var(--her)}
.cd-add-today.done{background:var(--green)}
.cd-del{background:none;border:none;font-size:13px;cursor:pointer;padding:3px;color:var(--light)}
/* ── ADD DISH MODAL ── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.show{opacity:1;pointer-events:all}
.modal-box{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:20px 18px 28px;transform:translateY(40px);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.modal.show .modal-box{transform:translateY(0)}
.modal-title{font-size:16px;font-weight:800;margin-bottom:14px}
.form-group{margin-bottom:10px}
.form-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.form-input{width:100%;padding:9px 11px;border:1.5px solid var(--border2);border-radius:9px;background:var(--soft);color:var(--text);font-size:13px;outline:none}
.form-input:focus{border-color:var(--him)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-err{font-size:11px;color:var(--red);margin-top:6px;min-height:14px}
.modal-btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.btn-cancel{background:var(--soft);color:var(--muted)}
/* ── LOCK OVERLAY ── */
.lock-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px}
.lock-overlay.hidden{display:none}
.lock-title{font-size:18px;font-weight:800}
.lock-input{width:100%;max-width:280px;padding:11px 14px;border:1.5px solid var(--border2);border-radius:11px;background:var(--card);color:var(--text);font-size:14px;outline:none;text-align:center}
.lock-btn{padding:11px 28px;background:var(--him);color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer}
.lock-err{font-size:12px;color:var(--red);min-height:16px}
/* ── EMPTY STATE ── */
.cd-empty{padding:16px 13px;color:var(--muted);font-size:12px;text-align:center;border-top:1px solid var(--border)}
/* ── CUSTOM DISH BADGE ── */
.userdish-tag{font-size:9px;font-weight:700;background:var(--her-soft);color:var(--her);padding:1px 5px;border-radius:4px;margin-left:4px}
</style>
</head>
<body>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-title">🔒 Dish Library</div>
  <div style="font-size:13px;color:var(--muted);text-align:center">Enter passphrase to edit</div>
  <input class="lock-input" id="lockInput" type="password" placeholder="passphrase" autocomplete="off">
  <button class="lock-btn" id="lockBtn">Unlock</button>
  <div class="lock-err" id="lockErr"></div>
  <button style="margin-top:8px;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer" onclick="viewOnly()">Browse without editing →</button>
</div>

<div class="cd-header">
  <div class="cd-header-row1">
    <a href="index.html" class="icon-btn" style="text-decoration:none">🏠</a>
    <div class="cd-title">📚 Dish Library</div>
    <span class="sync-dot" id="syncDot"></span>
    <button class="icon-btn" id="themeBtn">☀️</button>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="searchInput" placeholder="Search dishes…" type="text">
    <button class="search-clear" id="searchClear">✕</button>
  </div>
</div>

<div class="person-tabs">
  <button class="tab-btn him active" id="tabHim" onclick="switchPerson('him')">👨 Him</button>
  <button class="tab-btn her" id="tabHer" onclick="switchPerson('her')">👩 Her</button>
</div>

<div class="cd-section" id="dishSections"></div>

<!-- ADD DISH MODAL -->
<div class="modal" id="addModal">
  <div class="modal-box">
    <div class="modal-title" id="addModalTitle">➕ New Dish</div>
    <div class="form-group">
      <div class="form-label">Dish name</div>
      <input class="form-input" id="addName" placeholder="e.g. Paneer tikka">
    </div>
    <div class="form-group">
      <div class="form-label">Slot</div>
      <select class="form-input" id="addSlot"></select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <div class="form-label">Score</div>
        <input class="form-input" id="addScore" type="number" step="0.25" placeholder="0.5">
      </div>
      <div class="form-group">
        <div class="form-label">Sub-label</div>
        <input class="form-input" id="addSub" placeholder="optional">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><div class="form-label">Calories</div><input class="form-input" id="addCal" type="number" placeholder="0"></div>
      <div class="form-group"><div class="form-label">Protein (g)</div><input class="form-input" id="addProt" type="number" placeholder="0"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><div class="form-label">Carbs (g)</div><input class="form-input" id="addCarbs" type="number" placeholder="0"></div>
      <div class="form-group"><div class="form-label">Fat (g)</div><input class="form-input" id="addFat" type="number" placeholder="0"></div>
    </div>
    <div class="form-group" id="fiberRow">
      <div class="form-label">Fiber (g)</div>
      <input class="form-input" id="addFiber" type="number" placeholder="0">
    </div>
    <div class="form-err" id="addErr"></div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeAddModal()">Cancel</button>
      <button class="btn" id="addSaveBtn" onclick="saveNewDish()">Save dish</button>
    </div>
  </div>
</div>

core:-1.5,m:[250,4,35,12,1]},{id:'caffeine_h',label:'Excess caffeine (3+ coffees/lattes)',sub:'Raises cortisol',score:-.75,m:[0,0,0,0,0]}]},extras:[{id:'spearmint_x',label:'🌿 Extra spearmint teas',sub:'+0.5 each',score:.5,m:[5,0,1,0,0]},{id:'chaach_hx',label:'🥛 Chaach (salty lassi)',sub:'+0.25 — probiotic but contains dairy',score:.25,m:[55,3,5,2,0]},{id:'bubly_hx',label:'🫧 Bubly / sparkling water',sub:'Tracked — zero cal',score:0,m:[0,0,0,0,0]},{id:'walks_hx',label:'🚶 Extra walks (15+ min)',sub:'+0.5 each',score:.5,m:[0,0,0,0,0]},{id:'water_hx',label:'💧 Water glasses',sub:'Tracked only',score:0,m:[0,0,0,0,0]},{id:'flo_hx',label:'🫐 Low-GI fruit bowl',sub:'Berries, kiwi, apple · +0.25',score:.25,m:[60,1,14,0,3]},{id:'fmod_hx',label:'🍊 Moderate-GI fruit bowl',sub:'Mango, pineapple · -0.25',score:-.25,m:[65,1,16,0,2]},{id:'fhi_hx',label:'🍌 High-GI fruit bowl',sub:'Banana, watermelon · -1',score:-1,m:[70,1,18,0,1]},{id:'dairy_hx',label:'🥛 Extra dairy portions',sub:'-0.5 each',score:-.5,m:[80,5,5,6,0]},{id:'lattes_hx',label:'☕ Extra lattes',sub:'-0.5 each',score:-.5,m:[130,5,18,5,0]},{id:'biscuits_hx',label:'🥖 Extra biscuits (per 3)',sub:'-0.25 each',score:-.25,m:[95,2,16,3,1]}],workout:[{id:'badminton_h',label:'🏸 Badminton (1 hr)',burn:200},{id:'muaythai_h',label:'🥊 Muay Thai (1 hr)',burn:270},{id:'weights_h',label:'🏋️ Weight lifting (10 min)',burn:40},{id:'walk10_h',label:'🚶 Walk 10 min',burn:30},{id:'walk20_h',label:'🚶 Walk 20 min',burn:60},{id:'walk30_h',label:'🚶 Walk 30 min',burn:90}]};
const CONFIGS={him:HIM,her:HER};

// ── STATE ──
let favorites={him:{},her:{}};
let customDishes={him:{},her:{}};
let slotFav={him:{},her:{}};   // slotFav[p][slot] = optId for "crown" dish
let db=null,firebaseReady=false;
let activePerson='him';
let isUnlocked=false;
let addModalSlot=null,addModalPerson=null;
let theme=localStorage.getItem(LST)||'light';
let expandedSlots={};

// ── THEME ──
function applyTheme(){
  document.documentElement.setAttribute('data-theme',theme);
  document.getElementById('themeBtn').textContent=theme==='light'?'☀️':'🌙';
  localStorage.setItem(LST,theme);
}
document.getElementById('themeBtn').addEventListener('click',()=>{theme=theme==='light'?'dark':'light';applyTheme();});

// ── LOCK ──
function tryAutoUnlock(){
  try{const t=localStorage.getItem(LSUNLOCK);if(t&&(Date.now()-parseInt(t))<90*24*3600000){isUnlocked=true;document.getElementById('lockOverlay').classList.add('hidden');}}catch(e){}
}
function viewOnly(){document.getElementById('lockOverlay').classList.add('hidden');}
document.getElementById('lockBtn').addEventListener('click',()=>{
  const v=document.getElementById('lockInput').value.trim().toLowerCase();
  if(v===SECRET){isUnlocked=true;try{localStorage.setItem(LSUNLOCK,Date.now());}catch(e){}document.getElementById('lockOverlay').classList.add('hidden');renderSection();}
  else{document.getElementById('lockErr').textContent='✗ Incorrect passphrase';}
});
document.getElementById('lockInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lockBtn').click();});

// ── FIREBASE ──
function initFirebase(){
  const load=(src,cb)=>{const s=document.createElement('script');s.src=src;s.onload=cb;s.onerror=()=>{};document.head.appendChild(s);};
  load('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',()=>{
    load('https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js',()=>{
      try{
        if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
        db=firebase.database();firebaseReady=true;
        document.getElementById('syncDot').classList.add('live');
        startListeners();
      }catch(e){}
    });
  });
}
function startListeners(){
  if(!firebaseReady||!db)return;
  db.ref(`trackers/${SYNC_KEY}/favorites`).on('value',snap=>{
    const v=snap.val()||{};
    favorites={him:v.him||{},her:v.her||{}};
    try{localStorage.setItem(LSFAV,JSON.stringify(favorites));}catch(e){}
    renderSection();
  });
  db.ref(`trackers/${SYNC_KEY}/customDishes`).on('value',snap=>{
    const v=snap.val()||{};
    customDishes={him:v.him||{},her:v.her||{}};
    try{localStorage.setItem(LSCD,JSON.stringify(customDishes));}catch(e){}
    renderSection();
  });
  db.ref(`trackers/${SYNC_KEY}/slotFav`).on('value',snap=>{
    const v=snap.val()||{};
    slotFav={him:v.him||{},her:v.her||{}};
    renderSection();
  });
}
function loadLocal(){
  try{const f=localStorage.getItem(LSFAV);if(f)favorites=JSON.parse(f);}catch(e){}
  try{const c=localStorage.getItem(LSCD);if(c)customDishes=JSON.parse(c);}catch(e){}
  if(!favorites.him)favorites.him={};if(!favorites.her)favorites.her={};
  if(!customDishes.him)customDishes.him={};if(!customDishes.her)customDishes.her={};
}

// ── PERSON SWITCH ──
function switchPerson(p){
  activePerson=p;
  document.getElementById('tabHim').className='tab-btn him'+(p==='him'?' active':'');
  document.getElementById('tabHer').className='tab-btn her'+(p==='her'?' active':'');
  renderSection();
}

// ── URL PARAMS ──
function getUrlParams(){
  const u=new URLSearchParams(window.location.search);
  return {p:u.get('p')||'him',slot:u.get('slot')||null};
}

// ── SCORE BADGE CLASS ──
function scoreCls(s){return s>=1?'pos2':s>=0.25?'pos1':s===0?'zero':s>=-0.5?'neg1':'neg2';}
function oStr(s){return s>0?`+${s}`:String(s);}

// ── RENDER ──
function allDishesForSlot(p,sk){
  const cfg=CONFIGS[p];
  const slot=cfg.slots[sk];
  if(!slot||!slot.opts)return [];
  const base=slot.opts.map(o=>({...o,_sk:sk,_builtin:true}));
  const cd=customDishes[p]||{};
  const custom=Object.entries(cd).filter(([id,d])=>d.slot===sk).map(([id,d])=>({...d,id,_sk:sk,_builtin:false,userDish:true}));
  return [...base,...custom];
}

function renderSection(){
  const p=activePerson;
  const cfg=CONFIGS[p];
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  const sections=Object.entries(cfg.slots)
    .filter(([sk])=>sk!=='water')
    .map(([sk,slot])=>{
      const dishes=allDishesForSlot(p,sk);
      const filteredDishes=q?dishes.filter(d=>(d.label||'').toLowerCase().includes(q)||(d.sub||'').toLowerCase().includes(q)):dishes;
      if(q&&!filteredDishes.length)return '';
      const open=expandedSlots[sk]!==false; // open by default (close on first click unless URL-targeted)
      const arrow=open?'open':'';
      const hdrColor=p==='him'?'var(--him)':'var(--her)';
      const dishRows=filteredDishes.map(d=>renderDishRow(p,sk,d)).join('');
      return `<div class="cd-slot" data-slot="${sk}">
        <div class="cd-slot-hdr" onclick="toggleSlot('${sk}')">
          <div class="cd-slot-hdr-info">
            <div class="cd-slot-title" style="color:${hdrColor}">${slot.title}</div>
            <div class="cd-slot-time">${slot.time||''}${slot.subtitle?` · ${slot.subtitle}`:''}</div>
          </div>
          <button class="cd-slot-add" onclick="event.stopPropagation();openAddModal('${p}','${sk}')" title="Add dish to this slot">➕ Add dish</button>
          <span class="cd-slot-arrow ${arrow}">▶</span>
        </div>
        ${open?`<div class="cd-slot-body">${dishRows||'<div class="cd-empty">No dishes yet — add one above</div>'}</div>`:''}</div>`;
    }).join('');
  document.getElementById('dishSections').innerHTML=sections||'<div style="padding:24px;text-align:center;color:var(--muted)">No dishes match your search.</div>';
  // re-bind add-today buttons
  document.querySelectorAll('.cd-add-today').forEach(b=>b.addEventListener('click',handleAddToday));
  document.querySelectorAll('.cd-star').forEach(b=>b.addEventListener('click',handleStar));
  document.querySelectorAll('.cd-crown').forEach(b=>b.addEventListener('click',handleCrown));
  document.querySelectorAll('.cd-del').forEach(b=>b.addEventListener('click',handleDel));
}

function renderDishRow(p,sk,d){
  const id=d.id;
  const favKey=`${sk}__${id}`;
  const pinned=!!(favorites[p]&&favorites[p][favKey]);
  const crowned=slotFav[p]&&slotFav[p][sk]===id;
  const m=d.m||[0,0,0,0,0];
  const showFib=p==='her';
  const macroPills=`<span class="cd-m">${m[0]} cal</span><span class="cd-m protein">${m[1]}g prot</span><span class="cd-m carbs">${m[2]}g carbs</span><span class="cd-m">${m[3]}g fat</span>${showFib?`<span class="cd-m">${m[4]||0}g fib</span>`:''}`;
  const customTag=d.userDish?'<span class="userdish-tag">custom</span>':'';
  const delBtn=d.userDish&&isUnlocked?`<button class="cd-del" data-p="${p}" data-id="${id}" title="Delete dish">🗑</button>`:'';
  return `<div class="cd-dish">
    <div class="score-badge ${scoreCls(d.score)}">${oStr(d.score)}</div>
    <div class="cd-dish-info">
      <div class="cd-dish-name">${d.label}${customTag}</div>
      ${d.sub?`<div class="cd-dish-sub">${d.sub}</div>`:''}
      <div class="cd-macros">${macroPills}</div>
    </div>
    <div class="cd-actions">
      <button class="cd-crown${crowned?' on':''}" data-p="${p}" data-sk="${sk}" data-id="${id}" title="${crowned?'#1 for this slot':'Set as slot #1'}">👑</button>
      <button class="cd-star${pinned?' on':''}" data-p="${p}" data-sk="${sk}" data-id="${id}" title="${pinned?'Unpin':'Pin to favorites'}">⭐</button>
      <button class="cd-add-today ${p}" data-p="${p}" data-sk="${sk}" data-id="${id}">+ Today</button>
      ${delBtn}
    </div>
  </div>`;
}

function toggleSlot(sk){
  expandedSlots[sk]=expandedSlots[sk]===false?true:false;
  renderSection();
}

// ── ACTIONS ──
function handleStar(e){
  e.stopPropagation();
  const b=e.currentTarget;
  const {p,sk,id}=b.dataset;
  const key=`${sk}__${id}`;
  if(!favorites[p])favorites[p]={};
  if(favorites[p][key]){
    delete favorites[p][key];
    if(firebaseReady&&db)db.ref(`trackers/${SYNC_KEY}/favorites/${p}/${key}`).remove();
  }else{
    favorites[p][key]=true;
    if(firebaseReady&&db)db.ref(`trackers/${SYNC_KEY}/favorites/${p}/${key}`).set(true);
  }
  try{localStorage.setItem(LSFAV,JSON.stringify(favorites));}catch(e){}
  renderSection();
}

function handleCrown(e){
  e.stopPropagation();
  const b=e.currentTarget;
  const {p,sk,id}=b.dataset;
  if(!slotFav[p])slotFav[p]={};
  const wasCrowned=slotFav[p][sk]===id;
  if(wasCrowned){
    delete slotFav[p][sk];
    if(firebaseReady&&db)db.ref(`trackers/${SYNC_KEY}/slotFav/${p}/${sk}`).remove();
  }else{
    slotFav[p][sk]=id;
    if(firebaseReady&&db)db.ref(`trackers/${SYNC_KEY}/slotFav/${p}/${sk}`).set(id);
  }
  renderSection();
}

function handleAddToday(e){
  e.stopPropagation();
  const b=e.currentTarget;
  const {p,sk,id}=b.dataset;
  const countKey=`${sk}__${id}`;
  if(firebaseReady&&db){
    const ref=db.ref(`trackers/${SYNC_KEY}/dt/${TODAY}/${p}/counts/${countKey}`);
    ref.transaction(v=>(v||0)+1);
  }
  b.textContent='✓ Added';b.classList.add('done');
  setTimeout(()=>{b.textContent='+ Today';b.classList.remove('done');},2000);
}

function handleDel(e){
  e.stopPropagation();
  if(!isUnlocked)return;
  const {p,id}=e.currentTarget.dataset;
  if(!confirm('Delete this dish?'))return;
  if(customDishes[p])delete customDishes[p][id];
  if(firebaseReady&&db)db.ref(`trackers/${SYNC_KEY}/customDishes/${p}/${id}`).remove();
  try{localStorage.setItem(LSCD,JSON.stringify(customDishes));}catch(e){}
  renderSection();
}

// ── ADD DISH MODAL ──
function openAddModal(p,sk){
  if(!isUnlocked){alert('Unlock editing to add dishes.');return;}
  addModalPerson=p;addModalSlot=sk;
  const cfg=CONFIGS[p];
  document.getElementById('addModalTitle').textContent=`➕ Add dish — ${p==='him'?'👨 Him':'👩 Her'}`;
  const sel=document.getElementById('addSlot');
  sel.innerHTML=Object.entries(cfg.slots).filter(([s])=>s!=='water').map(([s,sl])=>`<option value="${s}"${s===sk?' selected':''}>${sl.title}</option>`).join('');
  document.getElementById('fiberRow').style.display=p==='her'?'':'none';
  document.getElementById('addSaveBtn').style.background=p==='him'?'var(--him)':'var(--her)';
  document.getElementById('addSaveBtn').style.color='#fff';
  ['addName','addScore','addSub','addCal','addProt','addCarbs','addFat','addFiber'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('addErr').textContent='';
  document.getElementById('addModal').classList.add('show');
  setTimeout(()=>document.getElementById('addName').focus(),150);
}
function closeAddModal(){document.getElementById('addModal').classList.remove('show');}
function saveNewDish(){
  const p=addModalPerson;
  const name=document.getElementById('addName').value.trim();
  const slot=document.getElementById('addSlot').value;
  const scoreRaw=document.getElementById('addScore').value;
  const err=document.getElementById('addErr');
  if(!name){err.textContent='✗ Enter a dish name';return;}
  if(!scoreRaw||isNaN(parseFloat(scoreRaw))){err.textContent='✗ Enter a score (e.g. 0.5 or -1)';return;}
  const id='cust_'+Date.now().toString(36);
  const dish={
    label:name,slot,score:Math.round(parseFloat(scoreRaw)*100)/100,
    sub:document.getElementById('addSub').value.trim()||undefined,
    m:[parseFloat(document.getElementById('addCal').value)||0,
       parseFloat(document.getElementById('addProt').value)||0,
       parseFloat(document.getElementById('addCarbs').value)||0,
       parseFloat(document.getElementById('addFat').value)||0,
       parseFloat(document.getElementById('addFiber').value)||0],
    created:Date.now(),userDish:true,id
  };
  if(!customDishes[p])customDishes[p]={};
  customDishes[p][id]=dish;
  if(firebaseReady&&db)db.ref(`trackers/${SYNC_KEY}/customDishes/${p}/${id}`).set(dish);
  try{localStorage.setItem(LSCD,JSON.stringify(customDishes));}catch(e){}
  closeAddModal();
  renderSection();
  // scroll to the slot
  setTimeout(()=>{
    const el=document.querySelector(`[data-slot="${slot}"]`);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  },200);
}

// ── SEARCH ──
document.getElementById('searchInput').addEventListener('input',e=>{
  document.getElementById('searchClear').style.display=e.target.value?'block':'none';
  renderSection();
});
document.getElementById('searchClear').addEventListener('click',()=>{
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').style.display='none';
  renderSection();
});

// ── MODAL BACKDROP ──
document.addEventListener('click',e=>{if(e.target.id==='addModal')closeAddModal();});

// ── INIT ──
(function init(){
  theme=localStorage.getItem(LST)||'light';
  applyTheme();
  tryAutoUnlock();
  loadLocal();
  // URL params: ?p=him&slot=dinner
  const params=getUrlParams();
  if(params.p&&CONFIGS[params.p])activePerson=params.p;
  document.getElementById('tabHim').className='tab-btn him'+(activePerson==='him'?' active':'');
  document.getElementById('tabHer').className='tab-btn her'+(activePerson==='her'?' active':'');
  // open target slot, collapse rest
  if(params.slot){
    Object.keys(CONFIGS[activePerson].slots).forEach(sk=>{expandedSlots[sk]=sk===params.slot;});
  }
  renderSection();
  initFirebase();
  // scroll after firebase primes
  if(params.slot){
    setTimeout(()=>{
      const el=document.querySelector(`[data-slot="${params.slot}"]`);
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    },600);
  }
})();
</script>
</body>
</html>
